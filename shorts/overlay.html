<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: P; font-weight: 700; src: url(node_modules/@fontsource/poppins/files/poppins-latin-700-normal.woff2); }
@font-face { font-family: P; font-weight: 800; src: url(node_modules/@fontsource/poppins/files/poppins-latin-800-normal.woff2); }
@font-face { font-family: P; font-weight: 900; src: url(node_modules/@fontsource/poppins/files/poppins-latin-900-normal.woff2); }
@font-face { font-family: M; font-weight: 700; src: url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-700-normal.woff2); }
@font-face { font-family: M; font-weight: 800; src: url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-800-normal.woff2); }
:root { --yellow: #F2E500; --red: #E5232B; --blue: #1E4AE0; --ink: #07090d; }
html, body { margin: 0; background: transparent; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: P; }
.abs { position: absolute; }
/* ---------- captions ---------- */
#cap { position: absolute; left: 60px; right: 60px; top: 1306px; transform: translateY(-50%);
  display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; column-gap: 22px; row-gap: 0; z-index: 30; }
.w { display: inline-block; font-weight: 800; font-size: calc(84px * var(--k, 1)); line-height: 1.08; color: var(--yellow); letter-spacing: 0.5px;
  text-shadow: 0 0 2px #111, 3px 3px 0 #111, -3px 3px 0 #111, 3px -3px 0 #111, -3px -3px 0 #111, 0 4px 0 #111, 0 -4px 0 #111, 4px 0 0 #111, -4px 0 0 #111, 0 10px 18px rgba(0,0,0,.65);
  transform-origin: 50% 70%; }
.w.key { font-size: calc(116px * var(--k, 1)); font-weight: 900; }
.w.hl { color: #fff; background: var(--red); padding: 0 18px; border-radius: 10px; text-shadow: 0 4px 0 rgba(0,0,0,.35); box-shadow: 0 10px 24px rgba(0,0,0,.45); }
/* ---------- logo ---------- */
#logo { left: 66px; top: 64px; font-weight: 900; font-size: 54px; color: var(--blue); letter-spacing: 1px; z-index: 40;
  text-shadow: 0 0 1px #fff, 2px 2px 0 #fff, -2px 2px 0 #fff, 2px -2px 0 #fff, -2px -2px 0 #fff, 0 6px 14px rgba(0,0,0,.45); }
#logo.logo-img { left: 40px; top: 46px; text-shadow: none; }
#logo.logo-img img { display: block; width: 380px; height: auto; }
#logo.logo-img img.on-light { filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 2px #fff) drop-shadow(0 0 6px rgba(255,255,255,.9)); }
#logo.logo-img img.on-dark { display: none; filter: drop-shadow(0 0 8px rgba(255,255,255,.35)); }
/* ---------- inserts ---------- */
.ins { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 38%, #15181f 0%, #07090d 60%, #030405 100%); display: none; z-index: 10; overflow: hidden; }
.grid-wall { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.07) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.07) 2px, transparent 2px); background-size: 90px 90px; }
.floor-wrap { position: absolute; left: -50%; right: -50%; bottom: -10%; height: 55%; perspective: 600px; perspective-origin: 50% 0%; }
.floor { position: absolute; inset: 0; transform: rotateX(68deg); transform-origin: 50% 0%;
  background-image: linear-gradient(rgba(255,255,255,.55) 3px, transparent 3px), linear-gradient(90deg, rgba(255,255,255,.55) 3px, transparent 3px);
  background-size: 120px 120px; -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 30%, #000 100%); }
.title { position: absolute; left: 0; right: 0; text-align: center; font-family: M; font-weight: 800; font-size: 50px; color: #fff; letter-spacing: 8px;
  text-shadow: 0 0 10px rgba(255,255,255,.9), 0 0 28px rgba(255,255,255,.5); }
.lbl { position: absolute; font-family: M; font-weight: 800; font-size: 34px; color: #fff; letter-spacing: 3px; white-space: nowrap;
  text-shadow: 0 0 8px rgba(255,255,255,.9), 0 0 22px rgba(255,255,255,.45); transform: translateX(-50%); }
.node { position: absolute; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; background: #fff;
  box-shadow: 0 0 22px rgba(255,255,255,.75), 0 0 60px rgba(255,255,255,.3); display: flex; align-items: center; justify-content: center; }
.node svg { width: 58%; height: 58%; fill: #0b0d12; }
.node.big { width: 200px; height: 200px; margin: -100px 0 0 -100px; }
svg.lines { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
.card { position: absolute; width: 410px; height: 230px; border-radius: 26px; border: 4px solid #fff; background: rgba(255,255,255,.06);
  box-shadow: 0 0 18px rgba(255,255,255,.55), inset 0 0 30px rgba(255,255,255,.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.card svg { width: 60px; height: 60px; fill: #fff; filter: drop-shadow(0 0 6px rgba(255,255,255,.8)); }
.card .n { font-weight: 900; font-size: 66px; color: #fff; line-height: 1; }
.stamp { position: absolute; padding: 10px 22px; background: var(--red); color: #fff; font-weight: 900; font-size: 40px; border-radius: 10px;
  transform: rotate(-7deg); box-shadow: 0 8px 22px rgba(0,0,0,.6); white-space: nowrap; letter-spacing: 1px; }
.bar { position: absolute; width: 230px; border-radius: 18px 18px 6px 6px; }
.blabel { position: absolute; top: 1080px; width: 360px; text-align: center; transform: translateX(-50%); font-family: M; font-weight: 800; font-size: 36px; color: #fff; letter-spacing: 2px;
  text-shadow: 0 0 8px rgba(255,255,255,.8); }
.arrow { position: absolute; font-weight: 900; font-size: 120px; line-height: 1; transform: translateX(-50%); }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 50; pointer-events: none; }
/* ---------- CTA ---------- */
#cta { position: absolute; left: 50%; top: 1530px; z-index: 35; display: none; align-items: center; gap: 24px; padding: 22px 40px 22px 24px;
  background: #fff; border-radius: 999px; box-shadow: 0 14px 40px rgba(0,0,0,.5); transform-origin: 50% 50%; white-space: nowrap; }
#cta .ic { width: 96px; height: 96px; border-radius: 50%; background: var(--red); display: flex; align-items: center; justify-content: center; }
#cta .ic svg { width: 48px; height: 48px; fill: #fff; }
#cta .t1 { font-weight: 900; font-size: 58px; color: #111; line-height: 1; }
#cta .t2 { font-weight: 800; font-size: 32px; color: var(--blue); letter-spacing: 3px; margin-top: 6px; }
</style>
</head>
<body>
<div id="stage">
  <div id="logo" class="abs"></div>
  <div id="ins" class="ins"><div class="grid-wall"></div><div class="floor-wrap"><div class="floor"></div></div>
    <div class="title" id="ins-title"></div><svg class="lines" id="ins-lines"></svg><div id="ins-body"></div></div>
  <div id="cta"><div class="ic"></div><div><div class="t1"></div><div class="t2"></div></div></div>
  <div id="cap"></div>
  <div id="flash"></div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const backOut = (x) => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
let TL, ICON;
const svg = (name) => { const [w, h, , , d] = ICON[name]; return `<svg viewBox="0 0 ${w} ${h}"><path d="${d}"/></svg>`; };
const typed = (txt, p) => txt.slice(0, Math.round(txt.length * clamp(p)));

// ---------- captions ----------
let capKey = null;
function renderCaptions(t) {
  const c = TL.cards.find((c) => t >= c.s && t < c.e);
  const cap = $('#cap');
  if (!c) { cap.innerHTML = ''; capKey = null; return; }
  if (capKey !== c.s) {
    cap.innerHTML = c.words.map((w, i) => `<span class="w${w.key ? ' key' : ''}${w.hl ? ' hl' : ''}" data-i="${i}">${w.t}</span>`).join('');
    capKey = c.s;
    // normal captions: max two lines -> shrink until they fit (hook cards may use more)
    if (!c.hook) {
      let k = 1;
      const lines = () => { const bs = [...cap.querySelectorAll('.w')].map((e) => e.offsetTop + e.offsetHeight).sort((a, b) => a - b); let n = bs.length ? 1 : 0; for (let i = 1; i < bs.length; i++) if (bs[i] - bs[i - 1] > 45) n++; return n; };
      cap.style.setProperty('--k', k);
      while (lines() > 2 && k > 0.55) { k -= 0.05; cap.style.setProperty('--k', k); }
    } else cap.style.setProperty('--k', 1);
  }
  cap.querySelectorAll('.w').forEach((el, i) => {
    const w = c.words[i], p = (t - w.s) / 0.14;
    if (p < 0) { el.style.visibility = 'hidden'; return; }
    el.style.visibility = 'visible';
    const s = 0.6 + 0.4 * backOut(p);
    el.style.transform = `scale(${s}) translateY(${(1 - easeOut(p)) * 18}px)${w.hl ? ' rotate(-2deg)' : ''}`;
    el.style.opacity = clamp(p * 2);
  });
}

// ---------- generic inserts ----------
// Inserts sharing a `group` build on each other (items added in earlier ones stay on screen).
const groupOf = (ins) => TL.inserts.filter((x) => (x.group || x.type) === (ins.group || ins.type));
const icon = (n, fill) => svg(n || 'faCircle').replace('<svg', `<svg style="fill:${fill || '#0b0d12'}"`);
const COLORS = { yellow: ['#ffe95c', '#e0b400', 'rgba(242,229,0,.5)'], blue: ['#6fb6ff', '#1e4ae0', 'rgba(30,74,224,.6)'], red: ['#ff7a80', '#e5232b', 'rgba(229,35,43,.55)'], white: ['#ffffff', '#cfd6e0', 'rgba(255,255,255,.5)'] };
const NODE_POS = [[255, 520], [825, 520], [255, 760], [825, 760], [255, 1000], [825, 1000]];
const CENTER = [540, 760];

function rNodes(t, ins, lt) {
  const list = groupOf(ins), k = list.indexOf(ins);
  let lines = '', html = `<div class="node big" style="left:${CENTER[0]}px;top:${CENTER[1]}px;transform:scale(${0.92 + 0.08 * backOut(lt / 0.35)})">${icon(list[0].center?.icon || 'faUser')}</div>`;
  for (let j = 0; j <= k && j < NODE_POS.length; j++) {
    const [x, y] = NODE_POS[j], fresh = j === k, p = fresh ? (lt - 0.18) / 0.35 : 1;
    if (p <= 0) continue;
    const q = clamp(p * 1.6);
    lines += `<line x1="${CENTER[0]}" y1="${CENTER[1]}" x2="${CENTER[0] + (x - CENTER[0]) * q}" y2="${CENTER[1] + (y - CENTER[1]) * q}" stroke="#fff" stroke-width="5" style="filter:drop-shadow(0 0 6px #fff)"/>`;
    if (p > 0.3) html += `<div class="node" style="left:${x}px;top:${y}px;transform:scale(${backOut((p - 0.3) / 0.7)})${fresh ? '' : ';opacity:.8'}">${icon(list[j].add.icon)}</div>`;
    const tp = fresh ? (lt - 0.45) / 0.5 : 1;
    if (tp > 0) html += `<div class="lbl" style="left:${x}px;top:${j < 2 ? y - 140 : y + 88}px;font-size:${fresh ? 32 : 27}px;${fresh ? '' : 'opacity:.7'}">${typed(list[j].add.label, tp)}</div>`;
  }
  return [html, lines];
}

function rCards(t, ins, lt) {
  const list = groupOf(ins), k = list.indexOf(ins);
  const order = []; list.forEach((x) => x.show.forEach((n) => { if (!order.includes(n)) order.push(n); }));
  const prev = k > 0 ? list[k - 1].show : [];
  const rows = Math.ceil(order.length / 2), top0 = rows > 2 ? 420 : 480;
  const pos = (n) => { const i = order.indexOf(n); return [i % 2 ? 560 : 110, top0 + Math.floor(i / 2) * 270]; };
  let html = '', n = 0;
  for (const name of ins.show) {
    const fresh = !prev.includes(name), p = fresh ? (lt - 0.15 - 0.22 * n++) / 0.4 : 1;
    if (p <= 0) continue;
    const [x, y] = pos(name), ic = (ins.icons || list[0].icons || {})[name] || ins.icon || list[0].icon || 'faVial';
    html += `<div class="card" style="left:${x}px;top:${y}px;transform:scale(${backOut(p)});opacity:${clamp(p * 2)}">${icon(ic, '#fff')}<div class="n" style="font-size:${name.length > 11 ? 40 : name.length > 7 ? 52 : 66}px;text-align:center;padding:0 14px">${name}</div></div>`;
  }
  for (let j = 0; j <= k; j++) {
    for (const f of [].concat(list[j].flag || [])) {
      const p = j === k ? (t - f.at) / 0.25 : 1;
      if (p <= 0 || !order.includes(f.card)) continue;
      const [x, y] = pos(f.card);
      html += `<div class="stamp" style="left:${x + 30}px;top:${y + 200}px;transform:rotate(-7deg) scale(${1.6 - 0.6 * easeOut(p)});opacity:${clamp(p * 1.5)}">${f.text}</div>`;
    }
  }
  return [html, ''];
}

function rBars(t, ins, lt) {
  const bars = ins.bars, n = bars.length, B = 1060, pin = easeOut(lt / 0.4);
  const xs = n === 3 ? [250, 540, 830] : [340, 740];
  let html = '';
  bars.forEach((b, i) => {
    const m = b.mark ?? ins.s, v = (b.from + (b.to - b.from) * easeOut((t - m) / 0.6)) * 520 * pin, c = COLORS[b.color || 'yellow'], x = xs[i];
    html += `<div class="bar" style="left:${x - 115}px;top:${B - v}px;height:${v}px;background:linear-gradient(${c[0]},${c[1]});box-shadow:0 0 30px ${c[2]}"></div>
      <div class="blabel" style="left:${x}px">${b.label}</div>`;
    if (b.to !== b.from && t > m) html += `<div class="arrow" style="left:${x}px;top:${B - v - 140}px;color:${b.to > b.from ? '#F2E500' : '#ff4d55'};opacity:${clamp((t - m) / 0.2)}">${b.to > b.from ? '▲' : '▼'}</div>`;
  });
  return [html, ''];
}

function rFlow(t, ins, lt) {
  const L = ins.left, R = ins.right, link = ins.link ?? ins.s + 0.4;
  const p1 = backOut(lt / 0.35), p2 = (t - link) / 0.5;
  const lc = COLORS[L.color || 'red'][1];
  let html = `<div class="node big" style="left:270px;top:720px;background:${lc};transform:scale(${p1})">${icon(L.icon, '#fff')}</div><div class="lbl" style="left:270px;top:850px">${L.label}</div>`, lines = '';
  if (p2 > 0) {
    lines = `<line x1="390" y1="720" x2="${390 + 300 * easeOut(p2)}" y2="720" stroke="#fff" stroke-width="8" style="filter:drop-shadow(0 0 8px #fff)"/>`;
    html += `<div class="node big" style="left:810px;top:720px;transform:scale(${backOut((p2 - 0.4) / 0.6)})">${icon(R.icon)}</div><div class="lbl" style="left:810px;top:850px">${R.label}</div>`;
  }
  const mt = ins.meter;
  if (mt && t > mt.mark) {
    const p3 = (t - mt.mark) / 0.8, lvl = mt.up ? 38 + 62 * easeOut(p3) : 100 - 62 * easeOut(p3);
    html += `<div style="position:absolute;left:330px;top:960px;width:420px;height:46px;border:4px solid #fff;border-radius:23px;box-shadow:0 0 14px rgba(255,255,255,.6)">
      <div style="height:100%;width:${lvl}%;background:${mt.up ? '#ff4d55' : lvl > 60 ? '#F2E500' : '#ff4d55'};border-radius:20px"></div></div>
      <div class="lbl" style="left:540px;top:1030px">${mt.label}</div>`;
  }
  return [html, lines];
}

function fmtNum(v, p) { const x = Math.round(v * clamp(p)); return x.toLocaleString('en-US'); }
function rStat(t, ins, lt) {
  const items = ins.items, n = items.length;
  let html = '';
  items.forEach((it, i) => {
    const m = it.mark ?? ins.s + 0.1 + i * 0.5, p = (t - m) / 0.8;
    if (p <= 0) return;
    const y = n === 1 ? 560 : 430 + i * 360, c = COLORS[it.color || 'yellow'];
    const val = typeof it.value === 'number' ? (it.prefix || '') + fmtNum(it.value, easeOut(p)) + (it.suffix || '') : it.value;
    html += `<div style="position:absolute;left:0;right:0;top:${y}px;text-align:center;transform:scale(${backOut(p / 0.5)});opacity:${clamp(p * 3)}">
      ${it.icon ? `<div style="display:inline-block;width:96px;height:96px;margin-bottom:6px">${icon(it.icon, c[0])}</div><br>` : ''}
      <div style="font-weight:900;font-size:${String(val).length > 7 ? 150 : 190}px;line-height:1;color:${c[0]};text-shadow:0 0 30px ${c[2]},0 8px 0 rgba(0,0,0,.4)">${val}</div>
      <div class="lbl" style="position:relative;left:50%;top:14px;font-size:38px">${typed(it.text, (p - 0.3) / 0.6)}</div></div>`;
    if (n === 2 && i === 0 && ins.vs) html += `<div class="lbl" style="left:540px;top:${y + 290}px;font-size:40px;opacity:.7">VS</div>`;
  });
  return [html, ''];
}

const RENDER = { nodes: rNodes, cards: rCards, bars: rBars, flow: rFlow, stat: rStat };

function renderAt(t) {
  renderCaptions(t);
  // inserts
  let active = null;
  for (const ins of TL.inserts) if (t >= ins.s && t < ins.e) active = ins;
  if (TL.logo_dark_bg) {
    $('#logo .on-light').style.display = active ? 'none' : 'block';
    $('#logo .on-dark').style.display = active ? 'block' : 'none';
  }
  const el = $('#ins');
  el.style.display = active ? 'block' : 'none';
  if (active) {
    const lt = t - active.s;
    el.style.transform = `scale(${1.06 - 0.06 * easeOut(lt / 0.3)})`;
    el.querySelector('.floor').style.backgroundPosition = `0 ${(t * 60) % 120}px`;
    const title = active.title ?? groupOf(active)[0].title ?? '';
    $('#ins-title').textContent = title;
    $('#ins-title').style.top = (active.type === 'nodes' ? 262 : 300) + 'px';
    const [html, lines] = RENDER[active.type](t, active, lt);
    $('#ins-body').innerHTML = html; $('#ins-lines').innerHTML = lines;
  }
  // flash on every insert boundary
  let fl = 0;
  for (const ins of TL.inserts) for (const b of [ins.s, ins.e]) { const d = t - b; if (d >= 0 && d < 0.16) fl = Math.max(fl, 0.8 * (1 - d / 0.16)); }
  $('#flash').style.opacity = fl;
  // CTA
  const c = TL.cta, cta = $('#cta');
  if (c && t >= c.s) {
    const p = (t - c.s) / 0.45, pulse = 1 + 0.025 * Math.sin((t - c.s) * 5);
    cta.style.display = 'flex';
    cta.style.transform = `translateX(-50%) scale(${backOut(p) * pulse})`;
  } else cta.style.display = 'none';
}

window.OVL = {
  ready: false,
  async init(tl, icons) {
    TL = tl; ICON = icons;
    if (tl.logo) {
      const lg = $('#logo'); lg.className = 'abs logo-img';
      lg.innerHTML = `<img class="on-light" src="file://${tl.logo}">` + (tl.logo_dark_bg ? `<img class="on-dark" src="file://${tl.logo_dark_bg}">` : '');
      await Promise.all([...lg.querySelectorAll('img')].map((im) => new Promise((r) => { im.complete ? r() : (im.onload = r, im.onerror = r); })));
    } else $('#logo').textContent = tl.logo_text || '';
    if (tl.cta) { $('#cta .ic').innerHTML = svg('faPhone'); $('#cta .t1').textContent = tl.cta.text; $('#cta .t2').textContent = (tl.cta.sub || '') + ' ↓'; }
    await document.fonts.load('900 50px P'); await document.fonts.load('800 50px P'); await document.fonts.load('800 50px M');
    await document.fonts.ready;
    this.ready = true;
  },
  renderAt,
};
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owners End Card</title>
<style>
  @font-face { font-family: "Poppins"; font-weight: 400; src: url(fonts/poppins-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Poppins"; font-weight: 600; src: url(fonts/poppins-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Poppins"; font-weight: 800; src: url(fonts/poppins-latin-800-normal.woff2) format("woff2"); }
  :root { --cream: #fff3e2; --latte: #e8d2b4; --blue: #3d8ef0; --sky: #8fd0ff; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font-family: Poppins, sans-serif; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; container-type: size; background: #07050a; }
  #stage > * { position: absolute; }
  #bgimg { inset: -6%; background: url(assets/owners.jpg) center/cover; filter: blur(38px) brightness(.45) saturate(1.1); }
  #tint { inset: 0; background: radial-gradient(90% 60% at 50% 38%, rgba(61,142,240,.18), transparent 70%), linear-gradient(transparent 45%, rgba(5,4,8,.92) 80%); }
  #frame { left: 6cqw; right: 6cqw; top: 15cqh; aspect-ratio: 3 / 2; border-radius: 3cqw; overflow: hidden;
    box-shadow: 0 3cqw 8cqw rgba(0,0,0,.6), 0 0 0 .5cqw rgba(255,243,226,.9); }
  #photo { position: absolute; inset: 0; background: url(assets/owners.jpg) center/cover; }
  #glow { left: 6cqw; right: 6cqw; top: 15cqh; aspect-ratio: 3 / 2; border-radius: 3cqw; box-shadow: 0 0 6cqw 1cqw rgba(61,142,240,.45); }
  #text { left: 6cqw; right: 6cqw; top: 59cqh; text-align: center; color: var(--cream); }
  .line { overflow: hidden; padding: .06em 0 .12em; }
  .in { display: inline-block; }
  .kicker { font: 600 2.6cqw/1.2 Poppins; letter-spacing: .4em; text-transform: uppercase; color: var(--latte); }
  .names { font: 800 9.6cqw/1.05 Poppins; letter-spacing: -.02em; margin-top: 1.2cqh; text-shadow: 0 .6cqw 3cqw rgba(0,0,0,.6); }
  .amp { color: var(--sky); }
  .role { font: 400 3.4cqw/1.4 Poppins; color: var(--latte); margin-top: 1cqh; }
  .rule { width: 16cqw; height: 2px; margin: 2.4cqh auto; background: linear-gradient(90deg, transparent, var(--latte), transparent); }
  .thanks { font: 600 3cqw/1.4 Poppins; letter-spacing: .06em; }
  #brand { left: 0; right: 0; bottom: 7cqh; display: flex; justify-content: center; align-items: center; gap: 1.6cqw;
    color: var(--cream); font: 600 2.2cqw/1 Poppins; letter-spacing: .32em; text-transform: uppercase; opacity: .85; }
  #brand img { width: 4.4cqw; height: 4.4cqw; }
  #grain { inset: 0; opacity: .08; mix-blend-mode: overlay; background-size: 256px 256px; }
  #black { inset: 0; background: #000; }
</style>
</head>
<body>
<div id="stage">
  <div id="bgimg"></div>
  <div id="tint"></div>
  <div id="glow"></div>
  <div id="frame"><div id="photo"></div></div>
  <div id="text">
    <div class="line kicker"><span class="in" data-d="0.5">Meet the owners</span></div>
    <div class="line names"><span class="in" data-d="0.75">Israel <span class="amp">&amp;</span> Mariella</span></div>
    <div class="line role"><span class="in" data-d="1.0">Owners · Israel Coffee Shop</span></div>
    <div class="rule" data-d="1.2"></div>
    <div class="line thanks"><span class="in" data-d="1.4">Thank you for being part of our story</span></div>
  </div>
  <div id="brand"><img src="logo.svg" alt=""><span>Israel Coffee Shop</span></div>
  <div id="grain"></div>
  <div id="black"></div>
</div>
<script>
  // Deterministic 5s end card: every frame is a function of t (same contract as reel.js).
  const DURATION = 5;
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const range = (t, a, b) => clamp((t - a) / (b - a));
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  const $ = (s) => document.querySelector(s);
  const g = document.createElement('canvas'); g.width = g.height = 256;
  { const c = g.getContext('2d'), d = c.createImageData(256, 256); let s = 99;
    for (let i = 0; i < d.data.length; i += 4) { s = (s * 1103515245 + 12345) & 0x7fffffff; const v = s % 256; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    c.putImageData(d, 0, 0); }
  $('#grain').style.backgroundImage = `url(${g.toDataURL()})`;

  function renderAt(t) {
    $('#black').style.opacity = 1 - range(t, 0, 0.6) + range(t, 4.4, 5);
    const p = easeOut(range(t, 0.1, 1.3));
    for (const el of [$('#frame'), $('#glow')]) {
      el.style.transform = `translateY(${(1 - p) * 6}cqh) rotate(${(1 - p) * -3}deg) scale(${0.9 + 0.1 * p})`;
      el.style.opacity = p;
    }
    $('#photo').style.transform = `scale(${1.12 - 0.08 * (t / DURATION)}) translateX(${-1 + 2 * (t / DURATION)}%)`;
    $('#bgimg').style.transform = `scale(${1 + 0.05 * (t / DURATION)})`;
    document.querySelectorAll('[data-d]').forEach((el) => {
      const d = +el.dataset.d, q = easeOut(range(t, d, d + 0.7));
      if (el.classList.contains('rule')) el.style.transform = `scaleX(${q})`;
      else el.style.transform = `translateY(${(1 - q) * 110}%)`;
    });
    $('#brand').style.opacity = 0.85 * range(t, 1.6, 2.4);
    const f = Math.floor(t * 30);
    $('#grain').style.backgroundPosition = `${(f * 73) % 256}px ${(f * 151) % 256}px`;
  }

  window.REEL = { duration: DURATION, renderAt, ready: false };
  Promise.all([document.fonts.ready, ...['assets/owners.jpg', 'logo.svg'].map((src) => new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = src; }))])
    .then(() => { window.REEL.ready = true; renderAt(new URLSearchParams(location.search).has('render') ? 0 : 2.5); });
</script>
</body>
</html>
